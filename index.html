<style>
:root{
  --bg:#12201A;
  --surface:#1B2A22;
  --surface-2:#22352A;
  --surface-3:#2B4032;
  --border:#3D5645;
  --border-soft:#243629;
  --text:#EDE6D4;
  --text-dim:#B3AC97;
  --text-faint:#7C8977;
  --accent:#B8935A;
  --accent-soft:#332C1D;
  --income:#C9A66B;
  --income-ink:#332C1D;
  --expense:#B0524A;
  --expense-ink:#33201D;
  --moto:#8B6F47;
  --health:#5C8A82;
  --household:#8E6B8B;
  --radius:14px;
  --font-display:'Playfair Display',serif;
  --font-body:'Inter',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;}
html{overflow-x:hidden;}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);overflow-x:hidden;width:100%;}
button{font-family:inherit;}
input,select,textarea{font-family:inherit;}
::selection{background:var(--accent);color:#1B2A22;}
.icon{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}
#app{display:flex;min-height:100vh;}
#sidebar{width:230px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border-soft);display:flex;flex-direction:column;padding:26px 16px;position:sticky;top:0;height:100vh;}
.brand{padding:0 6px 22px;border-bottom:1px solid var(--border-soft);margin-bottom:18px;}
.brand-name{font-family:var(--font-display);font-weight:600;font-size:22px;letter-spacing:0.2px;display:flex;align-items:center;gap:9px;color:var(--text);}
.brand-dot{width:9px;height:9px;border-radius:50%;background:var(--accent);flex-shrink:0;}
.brand-sub{font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:1.5px;margin-top:5px;padding-left:18px;}
.nav-item{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:10px;color:var(--text-dim);cursor:pointer;font-size:14px;font-weight:500;margin-bottom:3px;border:1px solid transparent;background:none;width:100%;text-align:left;}
.nav-item:hover{background:var(--surface-2);color:var(--text);}
.nav-item.active{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);}
#main{flex:1;min-width:0;padding:30px 34px 110px;max-width:1160px;}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px;flex-wrap:wrap;}
.page-title{font-family:var(--font-display);font-size:26px;font-weight:600;color:var(--text);}
.page-sub{font-size:13px;color:var(--text-faint);margin-top:2px;}
.btn{display:inline-flex;align-items:center;gap:7px;padding:10px 16px;border-radius:10px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;}
.btn:hover{background:var(--surface-3);}
.btn-accent{background:var(--accent);border-color:var(--accent);color:#1B2A22;}
.btn-accent:hover{background:#C7A16B;}
.btn-ghost{background:none;border-color:transparent;color:var(--text-dim);padding:6px 8px;}
.btn-ghost:hover{background:var(--surface-2);color:var(--text);}
.btn-danger{color:var(--expense);}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;background:var(--surface-2);border:1px solid var(--border);color:var(--text);padding:10px 12px;border-radius:9px;font-size:14px;}
input[type=number]{-moz-appearance:textfield;appearance:textfield;}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);}
textarea{resize:vertical;min-height:70px;}
label{display:block;font-size:12px;color:var(--text-dim);margin:0 0 6px;text-transform:uppercase;letter-spacing:0.5px;}
.field{margin-bottom:14px;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.checkbox-row{display:flex;align-items:center;gap:8px;margin-bottom:14px;}
.checkbox-row input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);flex-shrink:0;}
.checkbox-row label{margin:0;text-transform:none;font-size:14px;color:var(--text);letter-spacing:0;}

/* Dashboard */
.gauge-panel{background:var(--surface);border:1px solid var(--border-soft);border-radius:16px;padding:28px 26px;margin-bottom:24px;display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:18px;}
.gauge{display:flex;flex-direction:column;justify-content:center;}
.gauge-label{font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:2px;margin-bottom:6px;}
.gauge-value{font-family:var(--font-mono);font-weight:700;font-variant-numeric:tabular-nums;line-height:1;}
.gauge.big .gauge-value{font-size:40px;color:var(--accent);}
.gauge.income .gauge-value{font-size:24px;color:var(--income);}
.gauge.expense .gauge-value{font-size:24px;color:var(--expense);}
.gauge-sep{width:1px;background:var(--border-soft);}
.charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px;}
.chart-card{background:var(--surface);border:1px solid var(--border-soft);border-radius:16px;padding:22px;}
.chart-card h3{font-family:var(--font-display);font-size:16px;font-weight:600;margin:0 0 16px;color:var(--text);}
.legend-row{display:flex;align-items:center;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:1px solid var(--border-soft);}
.legend-row:last-child{border-bottom:none;}
.legend-left{display:flex;align-items:center;gap:8px;color:var(--text-dim);}
.legend-dot{width:9px;height:9px;border-radius:3px;flex-shrink:0;}
.legend-amt{font-family:var(--font-mono);font-weight:600;color:var(--text);}
.recent-card{background:var(--surface);border:1px solid var(--border-soft);border-radius:16px;padding:22px;}
.recent-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border-soft);}
.recent-row:last-child{border-bottom:none;}
.recent-badge{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.recent-badge.income{background:var(--income-ink);color:var(--income);}
.recent-badge.expense{background:var(--expense-ink);color:var(--expense);}
.recent-mid{flex:1;min-width:0;}
.recent-title{font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.recent-sub{font-size:12px;color:var(--text-faint);}
.recent-amt{font-family:var(--font-mono);font-weight:700;font-size:14px;white-space:nowrap;}
.recent-amt.income{color:var(--income);}
.recent-amt.expense{color:var(--expense);}
.empty-state{text-align:center;padding:60px 20px;color:var(--text-faint);}
.empty-state .icon{width:36px;height:36px;margin-bottom:10px;opacity:0.5;}

/* Subtabs (Мотоцикл) */
.subtabs{display:flex;gap:8px;margin-bottom:20px;}
.subtab-btn{padding:9px 16px;border-radius:9px;border:1px solid var(--border);background:var(--surface-2);color:var(--text-dim);font-size:13.5px;font-weight:600;cursor:pointer;}
.subtab-btn.active{background:var(--accent);border-color:var(--accent);color:#1B2A22;}

/* Stat row */
.stat-row{display:flex;gap:16px;margin-bottom:22px;flex-wrap:wrap;}
.stat-box{background:var(--surface);border:1px solid var(--border-soft);border-radius:14px;padding:16px 20px;flex:1;min-width:150px;}
.stat-box-label{font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;}
.stat-box-value{font-family:var(--font-mono);font-weight:700;font-size:22px;color:var(--text);}

/* Tickets */
.ticket-list{display:flex;flex-direction:column;gap:12px;}
.ticket{background:var(--surface);border:1px solid var(--border-soft);border-radius:12px;padding:14px 16px;position:relative;}
.ticket-head{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.badge{font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:0.3px;}
.ticket-date{font-size:12px;color:var(--text-dim);margin-left:auto;}
.ticket-div{border-top:1px dashed var(--border);margin:8px 0;}
.ticket-body{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;}
.ticket-desc{font-size:14px;line-height:1.4;color:var(--text-dim);}
.ticket-amt{font-family:var(--font-mono);font-weight:700;font-size:18px;white-space:nowrap;}
.ticket-actions{display:flex;gap:2px;flex-shrink:0;}
.ticket-mileage{font-family:var(--font-mono);font-size:13px;color:var(--text-dim);margin-bottom:4px;}

/* Modal */
#overlay{position:fixed;inset:0;background:rgba(43,38,32,0.55);display:none;align-items:flex-end;justify-content:center;z-index:100;}
#overlay.show{display:flex;}
.modal{background:var(--surface);width:100%;max-width:460px;border-radius:18px 18px 0 0;padding:24px 22px 26px;max-height:88vh;overflow-y:auto;border:1px solid var(--border);border-bottom:none;}
@media(min-width:640px){#overlay{align-items:center;}.modal{border-radius:18px;border-bottom:1px solid var(--border);}}
.modal-title{font-family:var(--font-display);font-size:20px;font-weight:600;margin:0 0 18px;display:flex;justify-content:space-between;align-items:center;color:var(--text);}
.modal-actions{display:flex;gap:10px;margin-top:18px;}
.modal-actions .btn{flex:1;justify-content:center;}

/* Mobile nav */
#mobilenav{display:none;}
.fab{position:fixed;bottom:24px;right:20px;width:60px;height:60px;border-radius:50%;background:var(--accent);color:#1B2A22;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:55;box-shadow:0 8px 24px rgba(0,0,0,0.45);}
.fab .icon{width:26px;height:26px;stroke-width:2.2;}

/* Lock screen */
#lock-screen{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;z-index:200;flex-direction:column;padding:20px;}
.lock-box{width:100%;max-width:320px;text-align:center;}
.lock-icon{width:46px;height:46px;color:var(--accent);margin:0 auto 18px;}
.lock-title{font-family:var(--font-display);font-size:22px;font-weight:600;margin-bottom:6px;}
.lock-sub{font-size:13px;color:var(--text-faint);margin-bottom:22px;}
#lock-input{text-align:center;font-size:18px;letter-spacing:2px;margin-bottom:14px;}
#lock-error{display:none;color:var(--expense);font-size:13px;margin-bottom:12px;}
#lock-btn{width:100%;justify-content:center;padding:12px;}

/* Storage warning */
#storage-banner{display:none;align-items:center;gap:10px;background:var(--expense-ink);color:var(--expense);border:1px solid var(--expense);padding:12px 16px;border-radius:12px;font-size:13px;margin-bottom:20px;}

@media(max-width:880px){
  #sidebar{display:none;}
  #main{padding:20px 16px 100px;}
  #mobilenav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border-soft);z-index:40;padding:6px 2px calc(6px + env(safe-area-inset-bottom));}
  .mnav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 1px;color:var(--text-faint);background:none;border:none;font-size:9.5px;font-weight:600;text-transform:uppercase;letter-spacing:0.2px;}
  .mnav-item.active{color:var(--accent);}
  .fab{bottom:78px;}
  .gauge-panel{grid-template-columns:1fr;gap:14px;text-align:left;}
  .gauge-sep{display:none;}
  .charts-grid{grid-template-columns:1fr;}
  .field-row{grid-template-columns:1fr;}
}
/* Segmented bars (replace donut charts) */
.seg-bar{display:flex;width:100%;height:16px;border-radius:9px;overflow:hidden;background:var(--surface-3);margin:4px 0 18px;}
.seg-bar-piece{height:100%;transition:opacity 0.15s;}
.seg-bar-piece:hover{opacity:0.8;}
.legend-pct{color:var(--text-faint);font-size:11.5px;margin-left:8px;}

/* Stock-style chart */
.chart-toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
.period-tabs{display:flex;gap:6px;}
.period-btn{padding:6px 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface-2);color:var(--text-dim);font-size:12.5px;font-weight:600;cursor:pointer;}
.period-btn.active{background:var(--accent);border-color:var(--accent);color:#1B2A22;}

/* Scale everything down ~10% except the mobile bottom nav bar */
#app, .fab, #overlay{zoom:0.9;}
</style>
</head>
<body>

<div id="lock-screen">
  <div class="lock-box">
    <svg class="lock-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
    <div class="lock-title">Мои финансы</div>
    <div class="lock-sub">Введите пароль для доступа</div>

<div id="app">

</div>

<div id="mobilenav"></div>
<button class="fab" id="fab" style="display:none;">
  <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
</button>

<div id="overlay"><div class="modal" id="modal-content"></div></div>

<script>
/* ==== ИКОНКИ ==== */
const ICONS = {
  home:'<path d="M3 3v18h18"></path><path d="M18 17V9"></path><path d="M13 17V5"></path><path d="M8 17v-3"></path>',
  income:'<polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline><polyline points="17 6 23 6 23 12"></polyline>',
  expense:'<polyline points="23 18 13.5 8.5 8.5 13.5 1 6"></polyline><polyline points="17 18 23 18 23 12"></polyline>',
  moto:'<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76Z"></path>',
  health:'<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.8 1-1a5.5 5.5 0 0 0 0-7.8Z"></path>',
  household:'<path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"></path><path d="M3 6h18"></path><path d="M16 10a4 4 0 0 1-8 0"></path>',
  settings:'<line x1="4" y1="21" x2="4" y2="14"></line><line x1="4" y1="10" x2="4" y2="3"></line><line x1="12" y1="21" x2="12" y2="12"></line><line x1="12" y1="8" x2="12" y2="3"></line><line x1="20" y1="21" x2="20" y2="16"></line><line x1="20" y1="12" x2="20" y2="3"></line><line x1="1" y1="14" x2="7" y2="14"></line><line x1="9" y1="8" x2="15" y2="8"></line><line x1="17" y1="16" x2="23" y2="16"></line>',
  plus:'<line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line>',
  edit:'<path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"></path>',
  trash:'<polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path>',
  download:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line>',
  upload:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line>',
  gauge:'<polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>',
  close:'<line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line>',
  wallet:'<path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"></path><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"></path><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"></path>',
  empty:'<circle cx="12" cy="12" r="9"></circle><line x1="9" y1="12" x2="15" y2="12"></line>'
};
function icon(name,cls){return `<svg class="icon ${cls||''}" viewBox="0 0 24 24" fill="none" stroke="currentColor">${ICONS[name]||''}</svg>`;}

/* ==== КОНФИГУРАЦИЯ КАТЕГОРИЙ ==== */
const GROUPS = {
  moto:{label:'Мотоцикл', icon:'moto', color:'#8B6F47', subcats:['Бензин','Обслуживание','Запчасти','Тюнинг и аксессуары']},
  health:{label:'Здоровье', icon:'health', color:'#5C8A82', subcats:['Врачи','Лекарства','Спорт','Страховка']},
  household:{label:'Быт', icon:'household', color:'#8E6B8B', subcats:['Продукты и бытовая химия','Развлечения','Алкоголь','Сигареты','Одежда','Аренда']}
};
const SUBCAT_COLORS = {
  'Бензин':'#8B6F47','Обслуживание':'#A9855B','Запчасти':'#C9A97C','Тюнинг и аксессуары':'#7C8FA6',
  'Врачи':'#5C8A82','Лекарства':'#7FAFA5','Спорт':'#4F7C5E','Страховка':'#9EC2B9',
  'Продукты и бытовая химия':'#8E6B8B','Развлечения':'#B08CAE','Алкоголь':'#B0524A','Сигареты':'#7C6A64','Одежда':'#C9AEC7','Аренда':'#6E8299'
};

const NAV_ITEMS = [
  {id:'dashboard', label:'Сводка', icon:'home'},
  {id:'income', label:'Доходы', icon:'income'},
  {id:'moto', label:'Мотоцикл', icon:'moto'},
  {id:'health', label:'Здоровье', icon:'health'},
  {id:'household', label:'Быт', icon:'household'},
  {id:'settings', label:'Настройки', icon:'settings'}
];

/* ==== СОСТОЯНИЕ ==== */
let incomes = [];
let expenses = [];
let maintenance = [];
let recurring = [];
let startBalance = 0;
let currentView = 'dashboard';
let motoSubview = 'expenses';

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function todayISO(){return new Date().toISOString().slice(0,10);}
function fmtDate(iso){if(!iso)return'';const[y,m,d]=iso.split('-');return d+'.'+m+'.'+y;}
function money(n){n=n||0;return (Math.round(n*100)/100).toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2})+' ₾';}
function monthKey(iso){return iso?iso.slice(0,7):'';}

/* ==== ХРАНИЛИЩЕ ДАННЫХ (Firebase) ==== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBfcpVTQkt7-4b7PyTTDUus_OfNlGZLVJQ",
  authDomain: "financetracker-a940d.firebaseapp.com",
  projectId: "financetracker-a940d",
  storageBucket: "financetracker-a940d.firebasestorage.app",
  messagingSenderId: "123463877726",
  appId: "1:123463877726:web:870b7b0c0b10072c92e0cf"
};
let db = null, docRef = null, firebaseReady = false;
try{
  firebase.initializeApp(FIREBASE_CONFIG);
  db = firebase.firestore();
  docRef = db.collection('finance').doc('data');
  firebaseReady = true;
  console.log('%c[Финансы] Firebase подключен успешно','color:#3F6B54;font-weight:bold');
}catch(e){
  console.error('[Финансы] Firebase НЕ подключен:', e);
}

function showStorageWarning(){
  const el=document.getElementById('storage-banner');
  if(el) el.style.display='flex';
}

async function saveAll(){
  if(!firebaseReady){console.warn('[Финансы] Сохранение пропущено — Firebase не подключен');showStorageWarning();return;}
  try{
    await docRef.set({startBalance,incomes,expenses,maintenance,recurring});
    console.log('%c[Финансы] Сохранено ✓','color:#3F6B54;font-weight:bold');
  }catch(e){
    console.error('[Финансы] Ошибка сохранения:', e);
    showStorageWarning();
  }
}

async function loadAll(){
  if(!firebaseReady){showStorageWarning();return;}
  try{
    const snap = await docRef.get();
    if(snap.exists){
      const d = snap.data();
      startBalance = d.startBalance||0;
      incomes = d.incomes||[];
      expenses = d.expenses||[];
      maintenance = d.maintenance||[];
      recurring = d.recurring||[];
      console.log('%c[Финансы] Загружено ✓','color:#3F6B54;font-weight:bold');
    } else {
      await saveAll();
    }
  }catch(e){
    console.error('[Финансы] Ошибка загрузки:', e);
    showStorageWarning();
  }
}

/* ==== ВЫЧИСЛЕНИЯ ==== */
function totalIncome(){return incomes.reduce((s,i)=>s+i.amount,0);}
function totalExpense(){return expenses.reduce((s,e)=>s+e.amount,0);}
function currentBalance(){return startBalance+totalIncome()-totalExpense();}
function thisMonthIncome(){const m=monthKey(todayISO());return incomes.filter(i=>monthKey(i.date)===m).reduce((s,i)=>s+i.amount,0);}
function thisMonthExpense(){const m=monthKey(todayISO());return expenses.filter(e=>monthKey(e.date)===m).reduce((s,e)=>s+e.amount,0);}
function groupTotal(g){return expenses.filter(e=>e.group===g).reduce((s,e)=>s+e.amount,0);}
function subcatTotals(g){const t={};GROUPS[g].subcats.forEach(s=>t[s]=0);expenses.filter(e=>e.group===g).forEach(e=>{t[e.subcat]=(t[e.subcat]||0)+e.amount;});return t;}
function lastMileage(){if(!maintenance.length)return null;return maintenance.reduce((max,m)=>Math.max(max,m.mileage||0),0);}

/* ==== ОБЯЗАТЕЛЬНЫЕ ПЛАТЕЖИ (recurring) ==== */
function runRecurringEngine(){
  const today=new Date();
  const todayDay=today.getDate();
  const curMonth=monthKey(todayISO());
  let changed=false;
  recurring.forEach(item=>{
    if(!item.generatedMonths) item.generatedMonths=[];
    if(!item.startMonth) item.startMonth=curMonth;
    let m=item.startMonth;
    let guard=0;
    while(m<=curMonth && guard<600){
      guard++;
      const isCurrent = m===curMonth;
      const duePassed = !isCurrent || todayDay>=item.day;
      if(duePassed && !item.generatedMonths.includes(m)){
        const [y,mo]=m.split('-').map(Number);
        const daysInMonth=new Date(y,mo,0).getDate();
        const day=Math.min(item.day,daysInMonth);
        const date=m+'-'+String(day).padStart(2,'0');
        expenses.push({id:uid(),date,group:item.group,subcat:item.subcat,amount:item.amount,note:item.note||'',recurringId:item.id});
        item.generatedMonths.push(m);
        changed=true;
      }
      m=addMonths(m,1);
    }
  });
  return changed;
}
function recurringStatusThisMonth(item){
  const cm=monthKey(todayISO());
  return (item.generatedMonths||[]).includes(cm);
}
function recurringRowHtml(item){
  const paid=recurringStatusThisMonth(item);
  const color=SUBCAT_COLORS[item.subcat]||GROUPS[item.group].color;
  return `<div class="legend-row" data-recurring-id="${item.id}" style="cursor:pointer;">
    <div class="legend-left"><span class="legend-dot" style="background:${color};"></span>${item.note?item.note+' · ':''}${item.subcat}<span class="legend-pct">до ${item.day} числа</span></div>
    <div style="display:flex;align-items:center;gap:10px;">
      <span class="badge" style="background:${paid?'var(--income-ink)':'var(--surface-3)'};color:${paid?'var(--income)':'var(--text-faint)'};">${paid?'Оплачено':'Ожидается'}</span>
      <div class="legend-amt">${money(item.amount)}</div>
    </div>
  </div>`;
}
function bindRecurringRowClicks(){
  document.querySelectorAll('[data-recurring-id]').forEach(el=>{
    el.onclick=()=>openRecurringModal(recurring.find(r=>r.id===el.dataset.recurringId));
  });
}
function openRecurringModal(item){
  const editing=!!item;
  const it=item||{group:'household',subcat:GROUPS.household.subcats[0],amount:'',day:1,note:''};
  function subcatOptions(g){return GROUPS[g].subcats.map(s=>`<option value="${s}" ${s===it.subcat?'selected':''}>${s}</option>`).join('');}
  openModal(editing?'Изменить обязательный платёж':'Обязательный платёж', `
    <div class="field"><label>Категория</label><select id="f-group">${Object.keys(GROUPS).map(g=>`<option value="${g}" ${g===it.group?'selected':''}>${GROUPS[g].label}</option>`).join('')}</select></div>
    <div class="field"><label>Подкатегория</label><select id="f-subcat">${subcatOptions(it.group)}</select></div>
    <div class="field-row">
      <div class="field"><label>Сумма (₾)</label><input type="number" id="f-amount" step="0.01" value="${it.amount}"></div>
      <div class="field"><label>День месяца</label><input type="number" id="f-day" min="1" max="31" value="${it.day}"></div>
    </div>
    <div class="field"><label>Заметка</label><input type="text" id="f-note" value="${it.note||''}" placeholder="Например, адрес квартиры"></div>
    <div class="modal-actions">
      <button class="btn" id="m-cancel">Отмена</button>
      <button class="btn btn-accent" id="m-save">Сохранить</button>
      ${editing?`<button class="btn btn-danger" id="m-delete">${icon('trash')}</button>`:''}
    </div>`);
  document.getElementById('m-cancel').onclick=closeModal;
  document.getElementById('f-group').onchange=(e)=>{document.getElementById('f-subcat').innerHTML=subcatOptions(e.target.value);};
  if(editing) document.getElementById('m-delete').onclick=async()=>{
    if(!confirm('Удалить обязательный платёж? Уже созданные расходы останутся в истории.')){return;}
    recurring=recurring.filter(x=>x.id!==item.id);
    await saveAll(); closeModal(); renderView();
  };
  document.getElementById('m-save').onclick=async()=>{
    const amount=Number(document.getElementById('f-amount').value);
    const day=Math.min(31,Math.max(1,Number(document.getElementById('f-day').value)||1));
    if(!amount||amount<=0){document.getElementById('f-amount').style.borderColor='var(--expense)';return;}
    const data={group:document.getElementById('f-group').value,subcat:document.getElementById('f-subcat').value,amount,day,note:document.getElementById('f-note').value.trim()};
    if(editing){Object.assign(item,data);}
    else{recurring.push({id:uid(),...data,startMonth:monthKey(todayISO()),generatedMonths:[]});}
    runRecurringEngine();
    await saveAll(); closeModal(); renderView();
  };
}

const INCOME_SOURCES = ['Зарплата','Аренда-СПБ','Сервис','Другое'];
const INCOME_SOURCE_COLORS = {'Зарплата':'#C9A66B','Аренда-СПБ':'#8FAE72','Сервис':'#8AA9C9','Другое':'#B08CAE'};
function incomeSourceTotals(){
  const t={}; INCOME_SOURCES.forEach(s=>t[s]=0);
  incomes.forEach(i=>{const s=INCOME_SOURCES.includes(i.source)?i.source:'Другое'; t[s]=(t[s]||0)+i.amount;});
  return t;
}

/* ==== НАВИГАЦИЯ ==== */
function renderNav(){
  const sideHtml = NAV_ITEMS.map(n=>`
    <button class="nav-item ${currentView===n.id?'active':''}" data-nav="${n.id}">
      ${icon(n.icon)}<span>${n.label}</span>
    </button>`).join('');
  document.getElementById('nav-items').innerHTML = sideHtml;
  document.querySelectorAll('[data-nav]').forEach(el=>{
    el.onclick=()=>{currentView=el.dataset.nav;renderNav();renderView();};
  });

  const mobHtml = NAV_ITEMS.map(n=>`
    <button class="mnav-item ${currentView===n.id?'active':''}" data-nav="${n.id}">
      ${icon(n.icon)}<span>${n.label}</span>
    </button>`).join('');
  document.getElementById('mobilenav').innerHTML = mobHtml;
  document.querySelectorAll('#mobilenav [data-nav]').forEach(el=>{
    el.onclick=()=>{currentView=el.dataset.nav;renderNav();renderView();};
  });
}

/* ==== МОДАЛКИ ==== */
function openModal(title, bodyHtml){
  document.getElementById('modal-content').innerHTML = `
    <div class="modal-title">${title}<button class="btn-ghost" id="m-close" style="background:none;border:none;cursor:pointer;display:flex;">${icon('close')}</button></div>
    ${bodyHtml}`;
  const overlay = document.getElementById('overlay');
  overlay.classList.add('show');
  document.getElementById('m-close').onclick=closeModal;
  overlay.onclick=(e)=>{if(e.target===overlay)closeModal();};
}
function closeModal(){document.getElementById('overlay').classList.remove('show');}

function openIncomeModal(item){
  const editing = !!item;
  const it = item || {date:todayISO(),amount:'',source:INCOME_SOURCES[0],note:''};
  openModal(editing?'Изменить доход':'Новый доход', `
    <div class="field"><label>Дата</label><input type="date" id="f-date" value="${it.date}"></div>
    <div class="field"><label>Сумма (₾)</label><input type="number" id="f-amount" step="0.01" value="${it.amount}"></div>
    <div class="field"><label>Источник</label><select id="f-source">${INCOME_SOURCES.map(s=>`<option value="${s}" ${s===it.source?'selected':''}>${s}</option>`).join('')}</select></div>
    <div class="field"><label>Заметка</label><textarea id="f-note">${it.note||''}</textarea></div>
    <div class="modal-actions">
      <button class="btn" id="m-cancel">Отмена</button>
      <button class="btn btn-accent" id="m-save">Сохранить</button>
      ${editing?`<button class="btn btn-danger" id="m-delete">${icon('trash')}</button>`:''}
    </div>`);
  document.getElementById('m-cancel').onclick=closeModal;
  if(editing) document.getElementById('m-delete').onclick=async()=>{
    incomes = incomes.filter(x=>x.id!==item.id);
    await saveAll(); closeModal(); renderView();
  };
  document.getElementById('m-save').onclick=async()=>{
    const amount=Number(document.getElementById('f-amount').value);
    if(!amount||amount<=0){document.getElementById('f-amount').style.borderColor='var(--expense)';return;}

function legendRowsHtml(totals, colors, labels){
  const entries = Object.entries(totals).filter(([k,v])=>v>0).sort((a,b)=>b[1]-a[1]);
  if(!entries.length) return `<div style="color:var(--text-faint);font-size:13px;padding:10px 0;">Пока нет данных</div>`;
  const sum = entries.reduce((s,[k,v])=>s+v,0);
  return entries.map(([k,v])=>`
    <div class="legend-row">
      <div class="legend-left"><span class="legend-dot" style="background:${colors[k]||'#999'};"></span>${labels?labels[k]:k}<span class="legend-pct">${Math.round(v/sum*100)}%</span></div>
      <div class="legend-amt">${money(v)}</div>
    </div>`).join('');
}

function segBarHtml(totals, colors){
  const entries = Object.entries(totals).filter(([k,v])=>v>0).sort((a,b)=>b[1]-a[1]);
  if(!entries.length) return `<div class="seg-bar"></div>`;
  const sum = entries.reduce((s,[k,v])=>s+v,0);
  return `<div class="seg-bar">${entries.map(([k,v])=>`<div class="seg-bar-piece" style="width:${(v/sum*100).toFixed(2)}%;background:${colors[k]||'#999'};" title="${k}: ${money(v)}"></div>`).join('')}</div>`;
}

function barCardHtml(title, totals, colors, labels){
  return `<div class="chart-card">
    <h3>${title}</h3>
    ${segBarHtml(totals,colors)}
    ${legendRowsHtml(totals,colors,labels)}
  </div>`;
}

const MONTH_NAMES_RU=['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
function addMonths(key,delta){let[y,m]=key.split('-').map(Number);m+=delta;while(m>12){m-=12;y+=1;}while(m<1){m+=12;y-=1;}return y+'-'+String(m).padStart(2,'0');}
function monthsRangeLastN(n){const cur=monthKey(todayISO());const arr=[];for(let i=n-1;i>=0;i--)arr.push(addMonths(cur,-i));return arr;}
function monthsBetween(minK,maxK){const arr=[];let cur=minK;let guard=0;while(cur<=maxK&&guard<600){arr.push(cur);cur=addMonths(cur,1);guard++;}return arr;}
function fmtMonthLabel(k){const[y,m]=k.split('-').map(Number);return MONTH_NAMES_RU[m-1]+' \u2019'+String(y).slice(2);}
function incomeMonthlySeries(period){
  let keys;
  if(period==='all'){
    if(!incomes.length) return {labels:[],values:[]};
    const minKey=incomes.map(i=>monthKey(i.date)).sort()[0];
    keys=monthsBetween(minKey, monthKey(todayISO()));
  } else {
    keys=monthsRangeLastN(period);
  }
  const totals={}; keys.forEach(k=>totals[k]=0);
  incomes.forEach(i=>{const k=monthKey(i.date); if(totals[k]!==undefined) totals[k]+=i.amount;});
  return {labels:keys.map(fmtMonthLabel), values:keys.map(k=>totals[k])};
}
let incomeChart=null;
let incomePeriod=12;
function renderIncomeChart(){
  const series=incomeMonthlySeries(incomePeriod);
  const canvas=document.getElementById('income-chart');
  if(!canvas) return;
  if(incomeChart){incomeChart.destroy();incomeChart=null;}
  if(!series.values.length || series.values.every(v=>v===0)){
    canvas.style.display='none';
    document.getElementById('income-chart-empty').style.display='block';
    return;
  }
  canvas.style.display='block';
  document.getElementById('income-chart-empty').style.display='none';
  const ctx=canvas.getContext('2d');
  const gradUp=ctx.createLinearGradient(0,0,0,240);
  gradUp.addColorStop(0,'rgba(201,166,107,0.35)');
  gradUp.addColorStop(1,'rgba(201,166,107,0)');
  const gradDown=ctx.createLinearGradient(0,0,0,240);
  gradDown.addColorStop(0,'rgba(176,82,74,0.35)');
  gradDown.addColorStop(1,'rgba(176,82,74,0)');
  incomeChart=new Chart(canvas,{
    type:'line',
    data:{labels:series.labels, datasets:[{
      data:series.values,
      borderWidth:2.5,
      pointRadius:3,
      pointBackgroundColor:'#EDE6D4',
      pointBorderColor:(ctx2)=>{
        const i=ctx2.dataIndex; const vals=series.values;
        if(i===0) return '#C9A66B';
        return vals[i]>=vals[i-1]?'#C9A66B':'#B0524A';
      },
      tension:0.3,
      fill:true,
      segment:{
        borderColor:(c)=> c.p0.parsed.y<=c.p1.parsed.y?'#C9A66B':'#B0524A',
        backgroundColor:(c)=> c.p0.parsed.y<=c.p1.parsed.y?gradUp:gradDown
      }
    }]},
    options:{
      responsive:true,
      maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{callbacks:{label:(c)=>money(c.parsed.y)}}},
      scales:{
        x:{position:'bottom', grid:{color:'#243629'}, ticks:{color:'#B3AC97',font:{size:11}}},
        y:{position:'right', grid:{color:'#243629'}, ticks:{color:'#B3AC97',font:{size:11},callback:(v)=>v>=1000?(v/1000)+'k':v}}
      }
    }
  });
}

    <div class="chart-card" style="max-width:420px;">
      <h3>Резервная копия</h3>
      <div style="font-size:13px;color:var(--text-dim);margin-bottom:16px;">Скачайте все данные в файл JSON или восстановите их из ранее сохранённой копии.</div>
      <div style="display:flex;gap:10px;">
        <button class="btn" id="backup-download" style="flex:1;justify-content:center;">${icon('download')}Скачать копию</button>
        <label class="btn" id="backup-restore-label" style="flex:1;justify-content:center;cursor:pointer;">${icon('upload')}Восстановить<input type="file" id="backup-file" accept=".json" style="display:none;"></label>
      </div>
    </div>
  `;
  document.getElementById('add-recurring').onclick=()=>openRecurringModal();
  bindRecurringRowClicks();
  document.getElementById('save-balance').onclick=async()=>{
    startBalance=Number(document.getElementById('start-balance').value)||0;
    await saveAll(); renderView();
  };
  document.getElementById('backup-download').onclick=()=>{
    const data=JSON.stringify({startBalance,incomes,expenses,maintenance,recurring},null,2);
    const blob=new Blob([data],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='finance-backup-'+todayISO()+'.json';
    a.click();
  };
  document.getElementById('backup-file').onchange=async()=>{
    const file=document.getElementById('backup-file').files[0];
    if(!file)return;
    if(!confirm('Это заменит все текущие данные данными из файла. Продолжить?')){document.getElementById('backup-file').value='';return;}
    try{
      const text=await file.text();
      const d=JSON.parse(text);
      startBalance=d.startBalance||0;
      incomes=d.incomes||[];
      expenses=d.expenses||[];
      maintenance=d.maintenance||[];
      recurring=d.recurring||[];
      runRecurringEngine();
      await saveAll();
      renderView();
      alert('Данные восстановлены');
    }catch(e){
      alert('Не удалось прочитать файл');
    }
    document.getElementById('backup-file').value='';
  };
  document.getElementById('fab').style.display='none';
}

/* ==== ГЛАВНЫЙ РЕНДЕР ==== */
function renderView(){
  if(currentView==='dashboard') renderDashboard();
  else if(currentView==='income') renderIncome();
  else if(currentView==='moto') renderMoto();
  else if(currentView==='health') renderExpenseSection('health');
  else if(currentView==='household') renderExpenseSection('household');
  else if(currentView==='settings') renderSettings();
}

/* ==== ЭКРАН ВХОДА ==== */
const APP_PASSWORD = "Vasa1225"; // ← обязательно поменяйте на свой пароль
function isUnlocked(){return localStorage.getItem('pf_unlocked_v1')==='yes';}
function unlock(){localStorage.setItem('pf_unlocked_v1','yes');}

async function startApp(){
  document.getElementById('lock-screen').style.display='none';
  await loadAll();
  if(runRecurringEngine()){ await saveAll(); }
  renderNav();
  renderView();
}

function initLock(){
  if(isUnlocked()){startApp();return;}
  const screen=document.getElementById('lock-screen');
  const input=document.getElementById('lock-input');
  const err=document.getElementById('lock-error');
  screen.style.display='flex';
  input.focus();
  function attempt(){
    if(input.value===APP_PASSWORD){unlock();startApp();}
    else{err.style.display='block';input.value='';input.focus();}
  }
  document.getElementById('lock-btn').onclick=attempt;
  input.onkeydown=(e)=>{if(e.key==='Enter')attempt();};
}

/* ---------- INIT ---------- */
initLock();
</script>
